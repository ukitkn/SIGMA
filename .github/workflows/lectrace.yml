name: Build and Deploy LecTrace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install CPU model and LecTrace dependencies
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[lectrace]' 'lectrace==1.1.30'

      - name: Build lecture site
        run: .venv/bin/lectrace build lectures/01_sigma_execution.py --output _site --no-incremental

      - name: Verify execution trace
        run: .venv/bin/python scripts/verify_lecture.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
