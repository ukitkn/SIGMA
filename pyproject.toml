[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-st"
version = "0.1.0"
description = "Spatial graph learning and invasion-axis analysis for colon tissue data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10,<0.12",
  "h5py>=3.9",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scanpy>=1.10,<1.12",
  "scikit-learn>=1.3",
  "scikit-misc>=0.3",
  "scipy>=1.10",
  "torch>=2.1",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "igraph>=0.11",
  "leidenalg>=0.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]
lectrace = ["lectrace>=1.1.16; python_version >= '3.11'"]

[project.scripts]
sigma = "sigma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
